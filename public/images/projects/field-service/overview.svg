      <text x="650" y="565">Validasi &amp; tinjauan</text>
      <text x="1135" y="565">Dashboard &amp; laporan</text>
    </g>
    <g fill="#a8b9d0" font-size="23">
      <text x="165" y="610">CSV / Excel</text>
      <text x="650" y="610">Periksa perubahan data</text>
      <text x="1135" y="610">Filter, rincian, ekspor</text>
